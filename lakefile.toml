name = "sagitta-flecha"
version = "0.1.0"
defaultTargets = ["CslibFrontier", "Cslib"]

# The only dependency is Mathlib, pinned to the same revision that cslib-frontier
# (commit 99f02811) uses through cslib 98f9a62. Fetch the prebuilt cache with
# `lake exe cache get`; Mathlib is never compiled here.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "bbff2954fe5ee3b7a4b33cc26ef873a1c3277d91"

[leanOptions]
autoImplicit = false

# Vendored subsets (see VENDORED.md): only the import closure that the
# Computational Arrow of Time needs, copied without modification.
[[lean_lib]]
name = "CslibFrontier"
globs = ["CslibFrontier.+"]

[[lean_lib]]
name = "Cslib"
globs = ["Cslib.+"]
