name = "sagitta-flecha"
version = "0.1.0"
defaultTargets = ["SagittaCore", "SagittaTM"]

# The only dependency is Mathlib, pinned to the same revision that cslib-frontier
# (commit 99f02811) uses through cslib 98f9a62. Fetch the prebuilt cache with
# `lake exe cache get`; Mathlib is never compiled here.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "bbff2954fe5ee3b7a4b33cc26ef873a1c3277d91"

# Vendored subsets (see VENDORED.md): only the import closure that the
# Computational Arrow of Time needs, copied without modification.
[[lean_lib]]
name = "CslibFrontier"
globs = ["CslibFrontier.+"]
# The same options as cslib-frontier's lakefile (99f02811), so every file compiles unchanged.
leanOptions = {weak.linter.mathlibStandardSet = true, weak.linter.flexible = true, weak.linter.pythonStyle = false, weak.linter.checkInitImports = false, weak.linter.allScriptsDocumented = false, weak.linter.unicodeLinter = false, autoImplicit = false}

[[lean_lib]]
name = "Cslib"
globs = ["Cslib.+"]
# The same options as cslib's lakefile (98f9a62): note that cslib keeps Lean's default
# `autoImplicit = true`, and some vendored files rely on it.
leanOptions = {weak.linter.mathlibStandardSet = true, weak.linter.flexible = true, weak.linter.pythonStyle = false, weak.linter.checkInitImports = false, weak.linter.allScriptsDocumented = false, weak.linter.unicodeLinter = false}

# The core: the abstract model, the laws, the localization and the second law. Only Mathlib.
[[lean_lib]]
name = "SagittaCore"
globs = ["Sagitta.Arrow.Core.+"]
leanOptions = {autoImplicit = false, relaxedAutoImplicit = false}

# The Turing-machine instance and the consequences, over the vendored cslib-frontier and cslib.
[[lean_lib]]
name = "SagittaTM"
roots = ["Sagitta"]
globs = ["Sagitta", "Sagitta.Arrow.TM.+", "Sagitta.Fidelity", "Sagitta.Fidelity.+"]
leanOptions = {autoImplicit = false, relaxedAutoImplicit = false}
